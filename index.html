/* =========================================================

:root{

  --brand-mid:#2196f3;
  --brand-light:#e3f2fd;
  --brand-soft:#f4f9ff;

  --text:#172b4d;

/* =========================================================
   🌌 MAIN BACKGROUND
   ========================================================= */

body{

    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:

      transparent 28%
    ),
    radial-gradient(
      circle at 90% 20%,
      rgba(25,118,210,.12),
      transparent 30%

    linear-gradient(
      135deg,
      #eef6ff 0%,
      #f7fbff 50%,
      #eaf3ff 100%

  color:var(--text);
}


/* =========================================================
   🔵 HEADER
   ========================================================= */

.header{

      135deg,

}

  gap:12px;
}

  height:42px;

  border-radius:12px;

  padding:4px;

  box-shadow:
    0 5px 15px rgba(0,0,0,.18);

  transition:.25s ease;
}


.header-left img:hover{
  transform:rotate(-3deg) scale(1.04);
}


.header-left h3{
  font-size:17px;
  letter-spacing:.4px;
}


/* =========================================================
   🔘 HEADER BUTTONS
   ========================================================= */

.logout-btn{
  border-radius:11px;

  background:rgba(255,255,255,.96);

  color:#1565c0;

  box-shadow:
    0 5px 15px rgba(0,0,0,.12);

  transition:.25s ease;
}


.logout-btn:hover{

  box-shadow:

  -webkit-backdrop-filter:blur(8px);

  transition:.25s ease !important;
}


.change-branch-btn:hover{
  background:rgba(255,255,255,.25) !important;

  transform:translateY(-2px) !important;
}


/* =========================================================
   📦 MAIN CONTAINER
   ========================================================= */

.container{
  padding:18px;
  max-width:900px;
  margin:auto;
}


/* =========================================================
   📷 SCANNER AREA
   ========================================================= */

#reader,
#auditReader{
  position:relative;

  background:#081b33;

  border-radius:22px !important;

  overflow:hidden;

  box-shadow:
    0 15px 40px rgba(13,71,161,.22);

  border:
    3px solid rgba(33,150,243,.25);

  transition:.3s ease;
}


#reader::after,
#auditReader::after{
  content:"";

  position:absolute;

  inset:12px;

  border:
    2px solid rgba(255,255,255,.18);

  border-radius:16px;

  pointer-events:none;
}


/* =========================================================
   🧾 INPUTS
   ========================================================= */

input{
  background:rgba(255,255,255,.92);

  color:var(--text);

  border:
    1px solid rgba(33,150,243,.10);

  box-shadow:
    0 5px 18px rgba(25,118,210,.08);

  outline:none;

  transition:
    border-color .25s ease,
    box-shadow .25s ease,
    transform .25s ease;
}


input::placeholder{
  color:#9aaabd;
}


input:focus{
  border-color:#2196f3;

  box-shadow:
    0 0 0 4px rgba(33,150,243,.12),
    0 8px 22px rgba(25,118,210,.12);

  transform:translateY(-1px);
}


.si-input{
  background:rgba(255,255,255,.96);

  border:
    1px solid rgba(33,150,243,.15);

  box-shadow:
    0 5px 20px rgba(25,118,210,.10);
}


/* =========================================================
   🔵 BUTTONS
   ========================================================= */

button{
  position:relative;

  overflow:hidden;

  border-radius:14px;

  letter-spacing:.2px;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    filter .2s ease;
}


button::after{
  content:"";

  position:absolute;

  top:0;
  left:-120%;

  width:70%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.28),
      transparent
    );

  transform:skewX(-20deg);

  transition:left .55s ease;

  pointer-events:none;
}


button:hover::after{
  left:140%;
}


button:hover{
  filter:brightness(1.03);
}


button:disabled{
  filter:grayscale(.15);
  cursor:not-allowed;
}


/* =========================================================
   💙 PRIMARY BLUE BUTTON
   ========================================================= */

.btn-blue{
  background:
    linear-gradient(
      135deg,
      #42a5f5 0%,
      #2196f3 40%,
      #1565c0 100%
    );

  box-shadow:
    0 8px 22px rgba(25,118,210,.25);
}


.btn-blue:hover{
  box-shadow:
    0 12px 28px rgba(25,118,210,.34);
}


/* =========================================================
   🟠 ORANGE BUTTON
   ========================================================= */

.btn-orange{

      #ff8a65,
      #ff5722

    0 8px 22px rgba(255,87,34,.20);
}


.btn-orange:hover{
  box-shadow:
    0 12px 28px rgba(255,87,34,.28);
}


/* =========================================================
   🧊 RESULT CARDS
   ========================================================= */

.card{
  position:relative;

  padding:18px;

  border-radius:18px;

  margin-top:14px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.98),
      rgba(248,252,255,.96)
    );

  border:
    1px solid rgba(33,150,243,.08);

  box-shadow:
    0 10px 28px rgba(25,118,210,.10);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  transition:
    transform .25s ease,
    box-shadow .25s ease;
}


.card:hover{
  transform:translateY(-2px);

  box-shadow:

}


.green{

  box-shadow:

}


.red{

  box-shadow:

}


/* =========================================================
   💾 SAVING CARD
   ========================================================= */

.saving{

      #e3f2fd,
      #ffffff

  box-shadow:
    0 12px 32px rgba(33,150,243,.16);
}


/* =========================================================
   ⏳ SPINNER
   ========================================================= */

.spinner{
  width:38px;
  height:38px;

  border:4px solid rgba(33,150,243,.15);

  border-top:

  box-shadow:
    0 4px 15px rgba(33,150,243,.12);
}


/* =========================================================
   ❌ NO RESULTS
   ========================================================= */

.no-results{

/* =========================================================
   🏢 BRANCH SELECTOR
   ========================================================= */

#branchScreen{

      rgba(13,71,161,.18),
      transparent 30%

    linear-gradient(
      135deg,
      #e3f2fd,
      #bbdefb
    );
}


.branch-card{

  width:360px;

  padding:30px 25px;

  background:
    rgba(255,255,255,.90);

  border:

  border-radius:28px;

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  animation:
    branchCardIn .45s ease;
}


@keyframes branchCardIn{
  from{

    transform:translateY(18px) scale(.96);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }

.branch-card h2{

      #0d47a1

  -webkit-text-fill-color:transparent;
}


.branch-card p{
  color:#718096;
}


.branch-grid{
  gap:10px;
}


.branch-option{
  background:
    linear-gradient(
      135deg,
      #42a5f5,
      #1976d2 55%,
      #0d47a1

  box-shadow:
    0 8px 20px rgba(25,118,210,.20);

  border:
    1px solid rgba(255,255,255,.20);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    filter .2s ease;
}


.branch-option:hover{
  transform:

  box-shadow:

.branch-option:active{
  transform:scale(.97);

.report-overlay{

/* =========================================================

#refreshBtn{

/* =========================================================

.scan-animate{

function sbHeaders(extra={}) {
  return Object.assign({
    apikey: SUPABASE_KEY,
    Authorization: "Bearer " + SUPABASE_KEY,
    Accept: "application/json",
    "Content-Type": "application/json"
  }, extra);
}

async function sbRequest(path, options={}) {
  const res = await fetch(SUPABASE_URL + path, Object.assign({}, options, {
    headers: sbHeaders(options.headers || {})
  }));
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : []; } catch(e) {
    throw new Error("Supabase returned invalid JSON: " + text.slice(0,300));
  }
  if (!res.ok) {
    const msg = data && (data.message || data.error || data.hint || data.details);
    throw new Error("Supabase HTTP " + res.status + (msg ? ": " + msg : ""));
  }
  return data;
}

  const active = rows.some(r => {
    const v = r.active ?? r.ACTIVE ?? r.enabled ?? r.ENABLED;
    return v === undefined || v === true || String(v).toLowerCase() === "true" || String(v) === "1";
  });

  const allowed = rows.some(r => {
    const raw = r.branch ?? r.BRANCH ?? r.branch_code ?? r.BRANCH_CODE ?? r.branches ?? r.BRANCHES;

}

function normalizeBarcode(value) {
  return String(value || "").trim().replace(/\s+/g, "").toUpperCase();
}

/* EXACT ORIGINAL DECODE FIX — DO NOT CHANGE */
function decodeBarcode(code){
  code = String(code || "").trim().toUpperCase();
  if(code.indexOf("-") > -1){ return normalizeBarcode(code); }
  if(code.length % 2 !== 0){ return normalizeBarcode(code); }
  let result = "";
  try{
    for(let i = 0; i < code.length; i += 2){
      const value = parseInt(code.substr(i,2),16);
      if(isNaN(value)){ return normalizeBarcode(code); }
      result += String.fromCharCode(value ^ 91);
    }
    return normalizeBarcode(result);
  }catch(err){ return normalizeBarcode(code); }
}

function getBranchFromBarcode(barcode){
  const parts = normalizeBarcode(barcode).split("-");
  return parts.length >= 2 ? parts[0] : "";
}

function validateBarcodeBranch(barcode, branch){
  const parts = normalizeBarcode(barcode).split("-");
  return parts.length >= 2 && parts[0] === String(branch).trim().toUpperCase();
}

function formatLens(value) {
  if (value === null || value === undefined) return "";
  let str = String(value).trim();
  if (str.includes("#ERROR") || str.includes("#VALUE")) return "0.00";
  str = str.replace(/^\++/, "");
  const hadPlus = String(value).trim().startsWith("+");
  if (!isNaN(str) && str !== "" && !str.includes("/")) {
    const num = Number(str);
    return hadPlus ? "+" + num.toFixed(2) : num.toFixed(2);
  }
  if (str.includes("/")) return hadPlus ? "+" + str : str;
  return hadPlus ? "+" + str : str;
}

async function getStockByBarcodeDirect(barcode){
  const parts = normalizeBarcode(barcode).split("-");
  if(parts.length < 2) return null;
  const br = parts[0], ntagn = parts.slice(1).join("-");
  const rows = await sbRequest("/rest/v1/" + branchTable(BRANCH,"stocks") + "?BR=eq." + encodeURIComponent(br) + "&NTAGN=eq." + encodeURIComponent(ntagn) + "&select=*&limit=1");
  return rows[0] || null;
}

async function isAlreadySoldDirect(barcode){
  const parts = normalizeBarcode(barcode).split("-");
  if(parts.length < 2) return null;
  const br = parts[0], ntagn = parts.slice(1).join("-");
  const rows = await sbRequest("/rest/v1/" + branchTable(BRANCH,"scanresults") + "?BR=eq." + encodeURIComponent(br) + "&NTAGN=eq." + encodeURIComponent(ntagn) + "&select=BR,NTAGN,DESCRIPTION,LENSTYPE&limit=1");
  return rows[0] || null;
}

async function directCheck(rawBarcode){
  await requireSupabaseAccess();
  const scannedBarcode = normalizeBarcode(rawBarcode);
  const barcode = decodeBarcode(scannedBarcode);
  if(!validateBarcodeBranch(barcode, BRANCH)){
    return {status:"WRONG BRANCH", selectedBranch:BRANCH, barcodeBranch:getBranchFromBarcode(barcode)};
  }
  const sold = await isAlreadySoldDirect(barcode);
  if(sold){ return {status:"DUPLICATE", colJ:String(sold.LENSTYPE||""), colO:String(sold.DESCRIPTION||""), tag:String(sold.NTAGN||"")}; }
  const stock = await getStockByBarcodeDirect(barcode);
  if(stock){ return {status:"FOUND", row:stockRowArray(stock), colJ:String(stock.LENSTYPE||""), colO:String(stock.DESCRIPTION||""), tag:String(stock.NTAGN||"")}; }
  return {status:"NOT FOUND"};
}

async function directSave(rawBarcode, siNo){
  const access = await requireSupabaseAccess();
  const barcode = decodeBarcode(normalizeBarcode(rawBarcode));
  if(!validateBarcodeBranch(barcode, BRANCH)) return {status:"WRONG BRANCH",selectedBranch:BRANCH,barcodeBranch:getBranchFromBarcode(barcode)};
  if(await isAlreadySoldDirect(barcode)) return {status:"ALREADY SAVED"};
  const stock = await getStockByBarcodeDirect(barcode);
  if(!stock) return {status:"NOT FOUND"};
  const row = stockRowArray(stock);
  while(row.length < 27) row.push("");
  row[14] = formatLens(row[14]);
  row[23] = String(siNo || "").trim();
  row[24] = manilaNow();
  row[25] = access.email;

  const payload = [{SDATE:row[0],SUPPLIER:row[1],DR:row[2],COST:row[3],ASG:row[4],CB:row[5],FD:row[6],UNITS:row[7],POWER:row[8],LENSTYPE:row[9],PUNIT:row[10],BR:row[11],NTAGN:row[12],CATEGORY:row[13],DESCRIPTION:row[14],LENSCODE:row[15],SELLINGPRICE:row[16],DELIVERYDATE:row[17],ORNUMBER:row[18],ORDATE:row[19],REMARKS:row[20],TAGPRICE:row[21],QR:row[22],"SI NO.":row[23],"DATE AND TIME":row[24],"USER EMAIL":row[25],STATUS:row[26]}];
  await sbRequest("/rest/v1/" + branchTable(BRANCH,"scanresults"), {method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(payload)});
  return {status:"ADDED TO SOLD",row};
}

async function processAuditQueue() {

    if (auditProcessing) return;

    auditProcessing = true;

    try {

        while (auditQueue.length > 0) {

            const barcode = auditQueue.shift();

            let saveData;
            try {
                saveData = await directSaveAudit(barcode);
            } catch(e) {
                document.getElementById("result").innerHTML = `<div class="card red">❌ ${e.message}</div>`;
                continue;
            }



            switch (saveData.status) {


                case "RECORDED":

                    auditCount++;

                    document.getElementById("auditCounter").innerHTML =
                    "Scanned : " + auditCount;


                    document.getElementById("result").innerHTML = `
                    <div class="card green scan-animate">

                    ✅ AUDIT RECORDED

                    <br><br>

                    <b>${saveData.colO || ""}</b><br>

                    ${saveData.colJ || ""}

                    <br>

                    🏷 Tag:
                    <b>${saveData.tag || ""}</b>

                    </div>
                    `;

                break;



                case "ALREADY_AUDITED":

                    document.getElementById("result").innerHTML = `
                    <div class="card red">

                    🛑 ALREADY AUDITED

                    <br><br>

                    🏷 Tag:
                    <b>${saveData.tag || ""}</b>

                    </div>
                    `;

                break;



                case "NOT_FOUND":

                    document.getElementById("result").innerHTML = `
                    <div class="card red">
                    ❌ NOT FOUND
                    </div>
                    `;

                break;



                default:

                    document.getElementById("result").innerHTML = `
                    <div class="card red">
                    ❌ ${saveData.status || "UNKNOWN ERROR"}

                    <br><br>

                    ${JSON.stringify(saveData)}

                    </div>
                    `;

            }


        }


    }
    catch(err){

        console.error(err);

        document.getElementById("result").innerHTML = `
        <div class="card red">
        ❌ ${err.message}
        </div>
        `;

    }
    finally{

        auditProcessing=false;

    }

}

async function searchSI() {

  out.innerHTML = `

    </div>
  `;

  try {

    const data = await directSearchSI(siNo);

    console.log("SEARCH SI RESPONSE:", data);

    if (data.status === "ERROR") {
      out.innerHTML = `
        <div class="card red">
          ❌ SEARCH ERROR
          <br><br>
          ${data.error || "Unknown error"}
          ${data.details ? `<br><br><small>${data.details}</small>` : ""}
        </div>
      `;
      return;
    }

    if (!Array.isArray(data.items) || !data.items.length) {
      out.innerHTML = `
        <div class="no-results">
          ❌ No results found
          <br><br>
          SI No: <b>${siNo}</b>
          <br>
          Branch: <b>${BRANCH}</b>
        </div>
      `;
      return;
    }

    out.innerHTML = data.items.map((item, idx) => `
      <div class="card">
        #${idx + 1}<br>
        <b>${item.colO || ""}</b><br>
        ${item.colJ ? `<small>${item.colJ}</small><br>` : ""}
        <small>🏷 Tag: <b>${item.tag || ""}</b></small><br>
        <small>📄 SI No: <b>${item.siNo || siNo}</b></small><br>
        <small>📅 ${item.date || "No Date"}</small>
      </div>
    `).join("");

  } catch (err) {

    console.error("SEARCH SI ERROR:", err);

    out.innerHTML = `
      <div class="card red">
        ❌ SEARCH FAILED
        <br><br>
        ${err.message || err}
      </div>
    `;

  }
}

let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function beep() {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "square";
  osc.frequency.value = 900;
  gain.gain.value = 0.15;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.12);
}

function vibrate() {
  if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
}

document.addEventListener("click", initAudio, { once: true });
