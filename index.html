*{box-sizing:border-box}

input,select{

button{

}
button:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(15,23,42,.12)}
button:active{transform:translateY(0) scale(.99)}
.btn-blue{

.btn-orange{

.card,.no-results,.saving{

  box-shadow:0 12px 35px rgba(15,23,42,.07);
}
.green{border-left:5px solid var(--success)}
.red{border-left:5px solid var(--danger)}

.no-results{text-align:center;color:var(--muted);font-weight:800}

.saving-text{font-size:16px;letter-spacing:.2px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes popIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}

.button-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.button-grid button{width:100%}

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2dXJobmFybGx2ZmlucGRrZmtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NzYxNzEsImV4cCI6MjEwMDQ1MjE3MX0.PFAW_RDcYwhNpeBic3CnrNBD2ndKqSi-8wbeH8AbXvM";

const BRANCH_NAMES = {
  GAI:"GAI BRANCH", CAS:"CAS BRANCH", BAC:"BAC BRANCH", BIN:"BIN BRANCH",
  BIS:"BIS BRANCH", CAD:"CAD BRANCH", DGT:"DGT BRANCH", KAB:"KAB BRANCH",
  KAL:"KAL BRANCH", PAS:"PAS BRANCH", POT:"POT BRANCH", SAN:"SAN BRANCH",
  TAB:"TAB BRANCH", TAN:"TAN BRANCH", TIS:"TIS BRANCH", TOL:"TOL BRANCH"
};

const BRANCH_CONFIG = {
  GAI:{prefix:"gai"}, CAS:{prefix:"cas"}, BAC:{prefix:"bac"}, BIN:{prefix:"bin"},
  BIS:{prefix:"bis"}, CAD:{prefix:"cad"}, DGT:{prefix:"dgt"}, KAB:{prefix:"kab"},
  KAL:{prefix:"kal"}, PAS:{prefix:"pas"}, POT:{prefix:"pot"}, SAN:{prefix:"san"},
  TAB:{prefix:"tab"}, TAN:{prefix:"tan"}, TIS:{prefix:"tis"}, TOL:{prefix:"tol"}
};

let BRANCH = localStorage.getItem("inventorySelectedBranch") || "";
let scanner = null;

/* ================= SUPABASE REST ================= */

function sbHeaders(extra={}){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY ||
     SUPABASE_ANON_KEY === "PASTE_YOUR_SUPABASE_ANON_KEY_HERE"){
    throw new Error("Add your Supabase ANON/PUBLISHABLE key in SUPABASE_ANON_KEY.");
  }
  return {
    apikey: SUPABASE_ANON_KEY,
    Authorization: "Bearer " + SUPABASE_ANON_KEY,
    ...extra
  };
}

async function sbFetch(table, query="", options={}){
  const url = SUPABASE_URL + "/rest/v1/" + table + query;
  const res = await fetch(url,{
    ...options,
    headers:sbHeaders({
      ...(options.headers || {}),
      "Content-Type":"application/json"
    })
  });

  const text = await res.text();
  let data = null;
  try{ data = text ? JSON.parse(text) : null; }catch(e){ data = text; }

  if(!res.ok){
    const message =
      typeof data === "object" && data?.message ? data.message :
      typeof data === "object" && data?.error ? data.error :
      text || ("Supabase HTTP " + res.status);
    const err = new Error(message);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function table(branch,type){
  branch = String(branch || "").trim().toUpperCase();
  if(!BRANCH_CONFIG[branch]) throw new Error("Invalid branch.");
  return BRANCH_CONFIG[branch].prefix + "_" + type.toLowerCase();
}

function normalizeBarcode(value){
  return String(value || "").trim().replace(/\s+/g,"").toUpperCase();
}

function getBranchFromBarcode(barcode){
  const parts = normalizeBarcode(barcode).split("-");
  return parts.length >= 2 ? parts[0] : "";
}

function validateBarcodeBranch(barcode,branch){
  return getBranchFromBarcode(barcode) === String(branch).trim().toUpperCase();
}

function formatLens(value){
  if(value === null || value === undefined) return "";
  let str = String(value).trim();
  if(str.includes("#ERROR") || str.includes("#VALUE")) return "0.00";
  const hadPlus = str.startsWith("+");
  str = str.replace(/^\++/,"");
  if(str !== "" && !str.includes("/") && !isNaN(str)){
    const n = Number(str);
    return hadPlus ? "+" + n.toFixed(2) : n.toFixed(2);
  }
  return hadPlus ? "+" + str : str;
}

function manilaNow(){
  return new Intl.DateTimeFormat("en-US",{
    timeZone:"Asia/Manila",
    month:"2-digit",day:"2-digit",year:"numeric",
    hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true
  }).format(new Date());
}

async function getStockByBarcode(barcode,branch=BRANCH){
  barcode = normalizeBarcode(barcode);
  const parts = barcode.split("-");
  if(parts.length < 2) return null;
  const br = parts[0];
  const ntagn = parts.slice(1).join("-");
  const q =
    "?BR=eq." + encodeURIComponent(br) +
    "&NTAGN=eq." + encodeURIComponent(ntagn) +
    "&select=*&limit=1";
  const rows = await sbFetch(table(branch,"stocks"),q);
  return rows?.[0] || null;
}

async function isAlreadySold(barcode,branch=BRANCH){
  barcode = normalizeBarcode(barcode);
  const parts = barcode.split("-");
  if(parts.length < 2) return null;
  const br = parts[0];
  const ntagn = parts.slice(1).join("-");
  const q =
    "?BR=eq." + encodeURIComponent(br) +
    "&NTAGN=eq." + encodeURIComponent(ntagn) +
    "&select=BR,NTAGN,DESCRIPTION,LENSTYPE&limit=1";
  const rows = await sbFetch(table(branch,"scanresults"),q);
  return rows?.[0] || null;
}

async function checkTagDirect(tag,branch=BRANCH){
  tag = String(tag || "").trim().toUpperCase();
  const q =
    "?BR=eq." + encodeURIComponent(branch) +
    "&NTAGN=eq." + encodeURIComponent(tag) +
    "&select=*&limit=1";
  const rows = await sbFetch(table(branch,"stocks"),q);
  if(!rows?.length) return {status:"NOT_FOUND"};
  const stock = rows[0];
  const barcode = normalizeBarcode(stock.BR + "-" + stock.NTAGN);
  const sold = await isAlreadySold(barcode,branch);
  if(sold){
    return {
      status:"DUPLICATE",barcode,
      colJ:String(stock.LENSTYPE || ""),
      colM:String(stock.NTAGN || ""),
      colO:formatLens(stock.DESCRIPTION || "")
    };
  }
  return {
    status:"FOUND",barcode,
    colJ:String(stock.LENSTYPE || ""),
    colM:String(stock.NTAGN || ""),
    colO:formatLens(stock.DESCRIPTION || "")
  };
}

/* ================= ACCESS/UI ================= */

function getSession(){
  return JSON.parse(
    localStorage.getItem("inventorySession_" + BRANCH) || "{}"
  );

function emailOf(){
  return String(getSession().email || "").trim().toLowerCase();
}

function checkReportAccess(){}

function updateBranchUI(){
  if(!BRANCH || !BRANCH_NAMES[BRANCH]) return;
  const label = document.getElementById("loginBranchLabel");
  const title = document.getElementById("branchTitle");
  if(label) label.textContent = BRANCH + " — " + BRANCH_NAMES[BRANCH];
  if(title) title.textContent = BRANCH_NAMES[BRANCH];
  document.title = "Inventory - " + BRANCH_NAMES[BRANCH];
}

function resetLoginForm(){
  const otp = document.getElementById("otp");
  const verify = document.getElementById("verifyBtn");
  const status = document.getElementById("loginStatus");
  const email = document.getElementById("email");
  if(otp){ otp.value=""; otp.style.display="none"; }
  if(verify) verify.style.display="none";
  if(status) status.innerHTML="";
  if(email) email.focus();
}

async function selectBranch(branch){
  branch = String(branch || "").trim().toUpperCase();
  if(!BRANCH_NAMES[branch]) return alert("Invalid branch.");
  BRANCH = branch;
  localStorage.setItem("inventorySelectedBranch",BRANCH);
  updateBranchUI();

  document.getElementById("branchScreen").style.display="none";
  document.getElementById("app").style.display="none";
  document.getElementById("loginScreen").style.display="flex";
  resetLoginForm();

  const session = getSession();
  if(!session.email || !session.sessionId) return;

  try{
    const data = await loginApi("checkSession",{
      branch:BRANCH,email:session.email,sessionId:session.sessionId
    });
    if(data.status === "VALID" || data.ok === true) openApp();
    else localStorage.removeItem("inventorySession_" + BRANCH);
  }catch(e){
    /* Do not silently bypass session validation. */
    forceLogout("Unable to verify session. Please log in again.");
  }
}

function openApp(){
  updateBranchUI();
  document.getElementById("branchScreen").style.display="none";
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("app").style.display="block";

}

async function changeBranch(){
  await stopNormalScanner();
  await stopAuditScanner(false);
  BRANCH="";
  localStorage.removeItem("inventorySelectedBranch");
  document.getElementById("app").style.display="none";
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("branchScreen").style.display="flex";
  clearUI();
}

/* ================= LOGIN — APPS SCRIPT ONLY ================= */

async function loginApi(action,params={}){
  const qs = new URLSearchParams({action,...params});
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(),15000);
  try{
    const res = await fetch(LOGIN_API_URL + "?" + qs.toString(),{
      signal:controller.signal
    });
    const text = await res.text();
    try{return JSON.parse(text);}
    catch(e){throw new Error("Login server returned invalid JSON.");}
  }finally{
    clearTimeout(timer);
  }
}

async function sendOTP(){
  const email = document.getElementById("email").value.trim().toLowerCase();
  if(!email) return alert("Enter Gmail");
  if(!BRANCH) return alert("Select branch first.");

  const status = document.getElementById("loginStatus");
  status.innerText = "Sending OTP...";

  try{
    const data = await loginApi("sendOTP",{branch:BRANCH,email});
    if(data.status === "OTP_SENT" || data.ok === true){
      if(data.alreadyLoggedIn){
        status.innerHTML = `
          <div class="login-warning">
            ⚠ Account already logged in.<br><br>
            <button onclick="forceLogin()" style="background:#f97316;color:#fff;padding:10px 16px;border:0;border-radius:10px;font-weight:800;">
              FORCE LOGOUT OTHER DEVICE
            </button>
          </div>`;
      }else{
        status.innerText="✅ OTP sent to Gmail";
      }
      document.getElementById("otp").style.display="block";
      document.getElementById("verifyBtn").style.display="block";
      document.getElementById("otp").focus();
    }else if(data.status === "EMAIL_DENIED"){
      status.innerText="❌ Gmail not allowed.";
    }else{
      status.innerText="❌ " + (data.status || "Login error.");
    }
  }catch(err){
    forceLogout("❌ Login server unavailable. You have been logged out. Please log in again.");
  }
}

async function verifyOTP(){
  const email = document.getElementById("email").value.trim().toLowerCase();
  const otp = document.getElementById("otp").value.trim();
  if(!email || !otp) return alert("Enter email and OTP.");

  try{
    const data = await loginApi("verifyOTP",{branch:BRANCH,email,otp});
    if(data.status === "OK" || data.ok === true){
      localStorage.setItem("inventorySession_" + BRANCH,JSON.stringify({
        email,sessionId:data.sessionId,time:Date.now()
      }));
      localStorage.setItem("loginTime_" + BRANCH,Date.now());
      openApp();
      return;
    }
    if(data.status === "ALREADY_LOGGED_IN"){
      if(confirm("Already logged in.\nForce logout other device?")) forceLogin();
      return;
    }
    document.getElementById("loginStatus").innerText =
      data.status === "INVALID" ? "❌ Wrong OTP." :
      data.status === "EMAIL_DENIED" ? "❌ Gmail not allowed." :
      "❌ Login failed.";
  }catch(err){
    forceLogout("❌ Login server unavailable. You have been logged out. Please log in again.");
  }
}

async function forceLogin(){
  const email = document.getElementById("email").value.trim().toLowerCase();
  const otp = document.getElementById("otp").value.trim();
  try{
    const data = await loginApi("forceLogin",{branch:BRANCH,email,otp});
    if(data.status === "OK" || data.ok === true){
      localStorage.setItem("inventorySession_" + BRANCH,JSON.stringify({
        email,sessionId:data.sessionId,time:Date.now()
      }));
      localStorage.setItem("loginTime_" + BRANCH,Date.now());
      openApp();

      forceLogout("❌ Force logout failed. Please request a new OTP.");
    }
  }catch(e){
    forceLogout("❌ Login server unavailable. You have been logged out. Please log in again.");
  }
}

  const refreshBtn=document.getElementById("refreshBtn");

  }else{

async function toggleScan(){
  const siNo=document.getElementById("siNo").value.trim();
  if(!siNo) return alert("Enter SI No");

  if(isScanning){
    await stopNormalScanner();
    return;
  }

  await stopAuditScanner(false);
  clearUI();
  isScanning=true;
  setUIScanning(true);

  try{
    const devices=await Html5Qrcode.getCameras();
    if(!devices.length) throw new Error("No camera detected");

    let cameraId=devices[0].id;
    for(const d of devices){
      const label=(d.label||"").toLowerCase();
      if(label.includes("back") || label.includes("rear")){cameraId=d.id;break;}
    }

    scanner=new Html5Qrcode("reader");
    await scanner.start(
      {deviceId:{exact:cameraId}},
      {
        fps:20,qrbox:{width:300,height:300},aspectRatio:1,
        videoConstraints:{facingMode:"environment",width:{ideal:1920},height:{ideal:1080}}
      },
      async code=>{
        if(!isScanning) return;
        isScanning=false;
        try{await scanner.stop();await scanner.clear();}catch(e){}
        scanner=null;setUIScanning(false);
        beep();vibrate();
        tempCode=code;tempSi=siNo;

        try{
          const barcode=normalizeBarcode(code);
          if(!validateBarcodeBranch(barcode,BRANCH)){
            showResult(`
              <div class="card red">
                ❌ WRONG BRANCH<br><br>
                Selected: <b>${BRANCH}</b><br>
                QR Branch: <b>${getBranchFromBarcode(barcode)||"UNKNOWN"}</b>
              </div>`);
            return;
          }
          const sold=await isAlreadySold(barcode,BRANCH);
          if(sold){
            showResult(`
              <div class="card red">
                🛑 ALREADY SOLD<br><br>
                <b>${escapeHtml(formatLens(sold.DESCRIPTION||""))}</b><br>
                ${sold.LENSTYPE ? `<small>${escapeHtml(sold.LENSTYPE)}</small><br>`:""}
                <small>🏷 Tag: <b>${escapeHtml(sold.NTAGN||"")}</b></small>
              </div>`);
            return;
          }
          const stock=await getStockByBarcode(barcode,BRANCH);
          if(stock){
            showResult(`
              <div class="card green scan-animate">
                ✅ AVAILABLE<br><br>
                <b>${escapeHtml(formatLens(stock.DESCRIPTION||""))}</b><br>
                ${stock.LENSTYPE ? `<small>${escapeHtml(stock.LENSTYPE)}</small><br>`:""}
                <small>🏷 Tag: <b>${escapeHtml(stock.NTAGN||"")}</b></small><br>
                <button id="saveBtn" class="btn-blue" onclick="saveYes()">ADD TO SOLD</button>
                <button class="btn-orange" onclick="cancelNo()">CANCEL</button>
              </div>`);
          }else{
            showResult(`<div class="no-results">❌ NOT FOUND</div>`);
          }
        }catch(err){
          showResult(`<div class="card red">❌ ${escapeHtml(err.message)}</div>`);
        }
      }
    );
    await enhanceCamera("reader",2);
  }catch(err){
    await stopNormalScanner();
    alert(err.message || "Cannot start camera.");
  }
}

async function stopNormalScanner(){
  if(scanner){
    try{await scanner.stop();await scanner.clear();}catch(e){}
    scanner=null;
  }
  isScanning=false;
  setUIScanning(false);
}

/* ================= AUDIT / RE-INVENTORY ================= */

async function toggleAuditScan(){
  await stopNormalScanner();
  const btn=document.getElementById("auditScanBtn");
  const scanBtn=document.getElementById("scanBtn");

  if(auditScanning){
    if(auditQueue.length || auditProcessing){
      const pending=auditQueue.length+(auditProcessing?1:0);
      const quit=await askQuitAudit(pending);
      if(!quit) return;
    }
    await stopAuditScanner(true);
    return;
  }

  auditScanning=true;
  auditQueue=[];
  auditProcessing=false;
  auditRecent.clear();
  auditCount=0;

  document.getElementById("auditCounter").style.display="block";
  document.getElementById("auditCounter").innerText="Scanned : 0";
  document.getElementById("auditReader").style.display="block";
  btn.innerHTML="⏹ STOP AUDIT";
  scanBtn.disabled=true;

  try{
    const cameras=await Html5Qrcode.getCameras();
    if(!cameras.length) throw new Error("No camera detected");

    let cameraId=cameras[0].id;
    for(const cam of cameras){
      const label=(cam.label||"").toLowerCase();
      if(label.includes("back")||label.includes("rear")){cameraId=cam.id;break;}
    }

    auditScanner=new Html5Qrcode("auditReader");
    await auditScanner.start(
      {deviceId:{exact:cameraId}},
      {
        fps:20,qrbox:{width:300,height:300},aspectRatio:1,
        videoConstraints:{facingMode:"environment",width:{ideal:1920},height:{ideal:1080}}
      },
      async decodedText=>{
        if(!auditScanning) return;
        const barcode=normalizeBarcode(decodedText);
        const now=Date.now();
        const last=auditRecent.get(barcode)||0;
        if(now-last<2000) return;
        auditRecent.set(barcode,now);
        for(const [k,t] of auditRecent) if(now-t>10000) auditRecent.delete(k);
        beep();vibrate();
        if(!auditQueue.includes(barcode)){
          auditQueue.push(barcode);
          processAuditQueue();
        }
      }
    );
    await enhanceCamera("auditReader",2);
  }catch(e){
    await stopAuditScanner(true);
    alert("Cannot start audit camera:\n"+e.message);
  }
}

async function stopAuditScanner(reset=true){
  auditScanning=false;
  if(auditScanner){
    try{await auditScanner.stop();await auditScanner.clear();}catch(e){}
    auditScanner=null;
  }
  if(reset){
    auditQueue=[];auditProcessing=false;auditRecent.clear();auditCount=0;
  }
  const reader=document.getElementById("auditReader");
  const counter=document.getElementById("auditCounter");
  const btn=document.getElementById("auditScanBtn");
  const scanBtn=document.getElementById("scanBtn");
  if(reader) reader.style.display="none";
  if(counter){counter.style.display="none";counter.innerText="Scanned : 0";}
  if(btn) btn.innerHTML="🔄 RE-INVENTORY";
  if(scanBtn){scanBtn.disabled=false;scanBtn.style.opacity="1";}
}

async function saveAuditDirect(barcode){
  const clean=normalizeBarcode(barcode);
  if(!validateBarcodeBranch(clean,BRANCH)){
    return {status:"WRONG BRANCH"};
  }
  const parts=clean.split("-");
  if(parts.length<2) return {status:"INVALID BARCODE"};
  const br=parts[0],ntagn=parts.slice(1).join("-");

  const existing=await sbFetch(
    table(BRANCH,"audit"),
    "?BR=eq."+encodeURIComponent(br)+
    "&NTAGN=eq."+encodeURIComponent(ntagn)+
    "&select=BR,NTAGN,%22DATE%20AND%20TIME%22&limit=1"
  );
  if(existing?.length){
    return {status:"ALREADY_AUDITED",tag:ntagn,date:existing[0]["DATE AND TIME"]};
  }

  const stock=await getStockByBarcode(clean,BRANCH);
  if(!stock) return {status:"NOT_FOUND"};

  const payload=[{
    SDATE:String(stock.SDATE||""),SUPPLIER:String(stock.SUPPLIER||""),
    DR:String(stock.DR||""),COST:String(stock.COST||""),
    ASG:String(stock.ASG||""),CB:String(stock.CB||""),FD:String(stock.FD||""),
    UNITS:String(stock.UNITS||""),POWER:String(stock.POWER||""),
    LENSTYPE:String(stock.LENSTYPE||""),PUNIT:String(stock.PUNIT||""),
    BR:String(stock.BR||""),NTAGN:String(stock.NTAGN||""),
    CATEGORY:String(stock.CATEGORY||""),
    DESCRIPTION:String(formatLens(stock.DESCRIPTION||"")),
    LENSCODE:String(stock.LENSCODE||""),SELLINGPRICE:String(stock.SELLINGPRICE||""),
    DELIVERYDATE:String(stock.DELIVERYDATE||""),ORNUMBER:String(stock.ORNUMBER||""),
    ORDATE:String(stock.ORDATE||""),REMARKS:String(stock.REMARKS||""),
    TAGPRICE:String(stock.TAGPRICE||""),QR:String(stock.QR||""),
    "SI NO.":"","DATE AND TIME":manilaNow(),
    "USER EMAIL":emailOf(),STATUS:"AUDITED"
  }];

  await sbFetch(table(BRANCH,"audit"),"",{
    method:"POST",
    headers:{"Prefer":"return=representation"},
    body:JSON.stringify(payload)
  });

  return {
    status:"RECORDED",
    tag:stock.NTAGN,
    colJ:stock.LENSTYPE,
    colO:formatLens(stock.DESCRIPTION)
  };
}

async function processAuditQueue(){
  if(auditProcessing) return;
  auditProcessing=true;
  try{
    while(auditQueue.length){
      const barcode=auditQueue.shift();
      try{
        const data=await saveAuditDirect(barcode);
        if(data.status==="RECORDED"){
          auditCount++;
          document.getElementById("auditCounter").innerText="Scanned : "+auditCount;
          showResult(`
            <div class="card green scan-animate">
              ✅ AUDIT RECORDED<br><br>
              <b>${escapeHtml(data.colO||"")}</b><br>
              ${escapeHtml(data.colJ||"")}<br>
              🏷 Tag: <b>${escapeHtml(data.tag||"")}</b>
            </div>`);
        }else if(data.status==="ALREADY_AUDITED"){
          showResult(`<div class="card red">🛑 ALREADY AUDITED<br><br>🏷 Tag: <b>${escapeHtml(data.tag||"")}</b></div>`);
        }else{
          showResult(`<div class="card red">❌ ${escapeHtml(data.status||"UNKNOWN ERROR")}</div>`);
        }
      }catch(err){
        showResult(`<div class="card red">❌ ${escapeHtml(err.message)}</div>`);
      }
    }
  }finally{auditProcessing=false}
}

function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

async function enhanceCamera(id,zoom=2){
  try{
    const video=document.querySelector("#"+id+" video");
    if(!video?.srcObject) return;
    const track=video.srcObject.getVideoTracks()[0];
    if(!track) return;
    const caps=track.getCapabilities?.()||{};
    const advanced=[];
    if(caps.focusMode?.includes("continuous")) advanced.push({focusMode:"continuous"});
    if(caps.zoom) advanced.push({zoom});
    if(advanced.length) await track.applyConstraints({advanced});
  }catch(e){console.log("Camera enhancement:",e)}
}

function askQuitAudit(pending){
  document.getElementById("quitAuditMessage").innerHTML=`
    ⚠ <b>${pending}</b> queued item(s) are still waiting to be processed.<br><br>
    If you stop now, those items <b>will NOT be saved.</b><br><br>
    Do you really want to stop Re-Inventory?`;
  document.getElementById("quitAuditDialog").style.display="flex";
  return new Promise(resolve=>{quitAuditResolve=resolve});
}
function confirmQuitAudit(){
  document.getElementById("quitAuditDialog").style.display="none";
  if(quitAuditResolve){quitAuditResolve(true);quitAuditResolve=null}
}
function cancelQuitAudit(){
  document.getElementById("quitAuditDialog").style.display="none";
  if(quitAuditResolve){quitAuditResolve(false);quitAuditResolve=null}
}

/* ================= SOUND / VIBRATION ================= */

function initAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
}
function beep(){
  try{
    initAudio();
    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.type="square";osc.frequency.value=900;gain.gain.value=.15;
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start();osc.stop(audioCtx.currentTime+.12);
  }catch(e){}
}
function vibrate(){if(navigator.vibrate) navigator.vibrate([150,80,150])}
document.addEventListener("click",initAudio,{once:true});

async function logout(){
  const session=getSession();
  const email=session.email||"";
  const sessionId=session.sessionId||"";
  const branch=BRANCH;

  localStorage.removeItem("inventorySession_"+branch);
  localStorage.removeItem("loginTime_"+branch);
  localStorage.removeItem("inventorySelectedBranch");

  await stopNormalScanner();
  await stopAuditScanner(true);

  try{
    await loginApi("logout",{branch,email,sessionId});
  }catch(e){console.log("Logout server call:",e)}

  location.reload();
}

function checkLoginExpiry(){
  const loginTime=localStorage.getItem("loginTime_"+BRANCH);
  if(!loginTime) return;
  const maxTime=13*60*60*1000;
  if(Date.now()-Number(loginTime)>maxTime){
    Object.keys(localStorage).forEach(k=>{
      if(k.startsWith("inventorySession_")) localStorage.removeItem(k);
    });
    localStorage.removeItem("loginTime_"+BRANCH);
    forceLogout("Session expired. Please login again.");
  }
}

  if(!session.email || !session.sessionId){
    document.getElementById("branchScreen").style.display="none";
    document.getElementById("loginScreen").style.display="flex";
    document.getElementById("app").style.display="none";
    resetLoginForm();
    return;
  }

  try{
    const data=await loginApi("checkSession",{
      branch:BRANCH,email:session.email,sessionId:session.sessionId
    });
    if(data.status==="VALID" || data.ok===true) openApp();
    else forceLogout("Session expired. Please login again.");
  }catch(e){
    forceLogout("Unable to verify session. Please login again.");
  }
});
</script>

</body>
</html>
