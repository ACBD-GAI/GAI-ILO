let SUPABASE_ACCESS_TOKEN = "";

function supabaseHeaders(extra={}){
  if(!SUPABASE_ACCESS_TOKEN){
    throw new Error("SUPABASE SESSION EXPIRED");
  }

  return Object.assign({
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ACCESS_TOKEN,
    "Content-Type": "application/json"
  }, extra);
}

function tableName(type){
  const prefix = String(BRANCH || "").trim().toLowerCase();
  if(!prefix) throw new Error("BRANCH NOT SELECTED");
  return prefix + "_" + type;
}

function normalizeBarcode(value){
  return String(value || "")
    .trim()
    .replace(/\s+/g, "")
    .toUpperCase();
}

/*
  IMPORTANT:
  The old decoder used ^91 while the encoder uses QR_SECRET.
  That was inconsistent and caused encoded QR values to decode incorrectly.
  This decoder now uses the SAME QR_SECRET algorithm as the encoder.
*/
function decodeBarcode(code){
  code = String(code || "").trim().toUpperCase();

  if(code.indexOf("-") > -1){
    return normalizeBarcode(code);
  }

  if(!code || code.length % 2 !== 0){
    return normalizeBarcode(code);
  }

  let result = "";

  try{
    for(let i=0; i<code.length; i+=2){
      const value = parseInt(code.substr(i,2),16);
      if(Number.isNaN(value)) return normalizeBarcode(code);

      result += String.fromCharCode(
        value ^ QR_SECRET.charCodeAt((i/2) % QR_SECRET.length)
      );
    }

    const decoded = normalizeBarcode(result);

    /*
      Only accept the decoded result when it has the expected
      BRANCH-TAG format. Otherwise keep the original QR value.
    */
    if(decoded.indexOf("-") > 0){
      return decoded;
    }

    return normalizeBarcode(code);
  }catch(e){
    return normalizeBarcode(code);
  }
}

function barcodeParts(input){
  const barcode = decodeBarcode(normalizeBarcode(input));
  const parts = barcode.split("-");

  return {
    barcode,
    branch: parts.length >= 2 ? parts[0] : "",
    tag: parts.length >= 2 ? parts.slice(1).join("-") : ""
  };
}

function validateBarcodeBranch(input){
  const p = barcodeParts(input);

  return {
    ok: p.branch === String(BRANCH || "").trim().toUpperCase(),
    barcode: p.barcode,
    branch: p.branch,
    tag: p.tag
  };
}

function formatLens(value){
  if(value === null || value === undefined) return "";

  let str = String(value).trim();

  if(str.includes("#ERROR") || str.includes("#VALUE")){
    return "0.00";
  }

  const hadPlus = str.startsWith("+");
  str = str.replace(/^\++/, "");

  if(!isNaN(str) && str !== "" && !str.includes("/")){
    const num = Number(str);
    return hadPlus ? "+" + num.toFixed(2) : num.toFixed(2);
  }

  if(str.includes("/")){
    return hadPlus ? "+" + str : str;
  }

  return hadPlus ? "+" + str : str;
}

async function sbGet(table, query){
  const url =
    SUPABASE_URL +
    "/rest/v1/" +
    table +
    "?" +
    query;

  const res = await fetch(url, {
    method:"GET",
    headers:supabaseHeaders()
  });

  const text = await res.text();

  if(!res.ok){
    throw new Error("SUPABASE " + res.status + ": " + text);
  }

  return text ? JSON.parse(text) : [];
}

async function sbInsert(table, rows){
  const res = await fetch(
    SUPABASE_URL + "/rest/v1/" + table,
    {
      method:"POST",
      headers:supabaseHeaders({
        "Prefer":"return=representation"
      }),
      body:JSON.stringify(rows)
    }
  );

  const text = await res.text();

  if(!res.ok){
    throw new Error("SUPABASE " + res.status + ": " + text);
  }

  return text ? JSON.parse(text) : [];
}

  This function intentionally has the same Response-like interface

  const res = await fetch(...); const data = await res.json();
  but the inventory request never reaches Apps Script.
*/

  const action = parsed.searchParams.get("action");

  const inventoryActions = [
    "check",

    "checkTag",
    "searchSI",
    "checkAudit",

  ];

    return window.__nativeFetch(url, options);

    if(!SUPABASE_ACCESS_TOKEN){
      throw new Error("SUPABASE SESSION EXPIRED");

    if(!BRANCH){
      throw new Error("BRANCH NOT SELECTED");
    }

    const branchCheck = parsed.searchParams.get("branch");
    if(branchCheck && branchCheck.toUpperCase() !== BRANCH.toUpperCase()){
      return fakeResponse({
        status:"WRONG BRANCH",
        selectedBranch:BRANCH,
        barcodeBranch:branchCheck
      });
    }

    if(action === "check"){
      return fakeResponse(await supabaseCheck(
        parsed.searchParams.get("barcode")
      ));
    }

    if(action === "save"){
      return fakeResponse(await supabaseSave(
        parsed.searchParams.get("barcode"),
        parsed.searchParams.get("siNo")
      ));
    }

    if(action === "checkTag"){
      return fakeResponse(await supabaseCheckTag(
        parsed.searchParams.get("tag")
      ));
    }

    if(action === "searchSI"){
      return fakeResponse(await supabaseSearchSI(
        parsed.searchParams.get("siNo")
      ));
    }

    if(action === "checkAudit" || action === "audit"){
      return fakeResponse(await supabaseCheckAudit(
        parsed.searchParams.get("barcode")
      ));
    }

    if(action === "saveAudit"){
      return fakeResponse(await supabaseSaveAudit(
        parsed.searchParams.get("barcode")
      ));
    }

    return fakeResponse({status:"UNKNOWN ACTION"});
  }catch(err){
    console.error("DIRECT SUPABASE ERROR", err);
    return fakeResponse({
      status:"ERROR",
      error:String(err && err.message ? err.message : err)
    });
  }
}

function fakeResponse(data){
  return {
    ok:true,
    status:200,
    async json(){ return data; },
    async text(){ return JSON.stringify(data); }
  };
}

async function supabaseCheck(input){
  const decoded = validateBarcodeBranch(input);

  if(!decoded.ok){
    return {
      status:"WRONG BRANCH",
      selectedBranch:BRANCH,
      barcodeBranch:decoded.branch
    };
  }

  const sold = await supabaseSoldByBarcode(decoded.barcode);

  if(sold.sold){
    return {
      status:"DUPLICATE",
      colJ:sold.sold.LENSTYPE || "",
      colO:formatLens(sold.sold.DESCRIPTION || ""),
      tag:sold.sold.NTAGN || decoded.tag
    };
  }

  const stock = await supabaseStockByBarcode(decoded.barcode);

  if(!stock.stock){
    return {status:"NOT FOUND"};
  }

  const row = rowFromStock(stock.stock);

  return {
    status:"FOUND",
    row,
    colJ:String(stock.stock.LENSTYPE || ""),
    colO:String(stock.stock.DESCRIPTION || ""),
    tag:String(stock.stock.NTAGN || "")
  };
}

async function supabaseSave(input, siNo){
  const decoded = validateBarcodeBranch(input);

  if(!decoded.ok){
    return {
      status:"WRONG BRANCH",
      selectedBranch:BRANCH,
      barcodeBranch:decoded.branch
    };
  }

  const sold = await supabaseSoldByBarcode(decoded.barcode);

  if(sold.sold){
    return {status:"ALREADY SAVED"};
  }

  const stockResult = await supabaseStockByBarcode(decoded.barcode);
  const stock = stockResult.stock;

  if(!stock){
    return {status:"NOT FOUND"};
  }

  const session = getStoredInventorySession();
  const email = String(session.email || "").trim().toLowerCase();

  const payload = {
    SDATE:stock.SDATE,
    SUPPLIER:stock.SUPPLIER,
    DR:stock.DR,
    COST:stock.COST,
    ASG:stock.ASG,
    CB:stock.CB,
    FD:stock.FD,
    UNITS:stock.UNITS,
    POWER:stock.POWER,
    LENSTYPE:stock.LENSTYPE,
    PUNIT:stock.PUNIT,
    BR:stock.BR,
    NTAGN:stock.NTAGN,
    CATEGORY:stock.CATEGORY,
    DESCRIPTION:formatLens(stock.DESCRIPTION || ""),
    LENSCODE:stock.LENSCODE,
    SELLINGPRICE:stock.SELLINGPRICE,
    DELIVERYDATE:stock.DELIVERYDATE,
    ORNUMBER:stock.ORNUMBER,
    ORDATE:stock.ORDATE,
    REMARKS:stock.REMARKS,
    TAGPRICE:stock.TAGPRICE,
    QR:stock.QR,
    "SI NO.":String(siNo || "").trim(),
    "DATE AND TIME":nowManila(),
    "USER EMAIL":email,
    STATUS:""
  };

  try{
    await sbInsert(tableName("scanresults"), [payload]);
  }catch(err){
    if(String(err).includes("duplicate") || String(err).includes("23505")){
      return {status:"ALREADY SAVED"};
    }
    throw err;
  }

  return {
    status:"ADDED TO SOLD",
    row:rowFromStock(stock)
      .concat([
        payload["SI NO."],
        payload["DATE AND TIME"],
        payload["USER EMAIL"]
      ])
  };
}

window.__nativeFetch = window.fetch.bind(window);
window.fetch = function(url, options){
  const u = String(url || "");
  if(u.indexOf("?action=") !== -1){
    const action = new URL(u, window.location.href)
      .searchParams.get("action");

    if([
      "check","save","checkTag","searchSI",
      "checkAudit","audit","saveAudit"
    ].includes(action)){
      return inventoryFetch(u, options);
    }
  }
  return window.__nativeFetch(url, options);
};

  try {

  "?action=verifyOTP" +

console.log(text);

      data = JSON.parse(text);
    } catch (e) {
      console.log(text);

      document.getElementById("loginStatus").innerHTML =
      "❌ Server returned invalid response.<br>Please try again.";

      return;
    }

    if (data.status === "OK") {

      localStorage.setItem(
        "inventorySession_" + BRANCH,
        JSON.stringify({
          email,
          sessionId: data.sessionId,
          time: Date.now()
        })
      );

      setSupabaseToken(data.accessToken || "");
      if(!data.accessToken){
        document.getElementById("loginStatus").innerText =
          "❌ Login succeeded but Supabase session was not created.";
        return;
      }

      localStorage.setItem("loginTime_" + BRANCH, Date.now());

      openApp();
      return;
    }

    if (data.status === "ALREADY_LOGGED_IN") {

      if (confirm("Already logged in.\nForce logout other device?")) {
        forceLogin();
      }

      return;
    }

    if (data.status === "INVALID") {

      document.getElementById("loginStatus").innerHTML =
      "❌ Wrong OTP.";

      return;
    }

    document.getElementById("loginStatus").innerHTML =
    "❌ Login failed.";

  }

  catch(err){

    console.error(err);

    document.getElementById("loginStatus").innerHTML =
    "❌ Cannot connect to server.";

  }

async function processAuditQueue() {

    if (auditProcessing) return;

    auditProcessing = true;

    try {

        while (auditQueue.length > 0) {

            const barcode = auditQueue.shift();

            const res = await fetch(
                API_URL +
                "?action=saveAudit" +
                "&barcode=" + encodeURIComponent(barcode) +
                getSessionParams()
            );


            const text = await res.text();

            console.log("SAVE AUDIT RAW RESPONSE:");
            console.log(text);


            let saveData;

            try {

                saveData = JSON.parse(text);

            } catch(e) {

                document.getElementById("result").innerHTML = `
                <div class="card red">
                    ❌ SERVER ERROR
                    <br><br>
                    <pre style="white-space:pre-wrap">
                    ${text}
                    </pre>
                </div>
                `;

                continue;
            }



            switch (saveData.status) {


                case "RECORDED":

                    auditCount++;

                    document.getElementById("auditCounter").innerHTML =
                    "Scanned : " + auditCount;


                    document.getElementById("result").innerHTML = `
                    <div class="card green scan-animate">

                    ✅ AUDIT RECORDED

                    <br><br>

                    <b>${saveData.colO || ""}</b><br>

                    ${saveData.colJ || ""}

                    <br>

                    🏷 Tag:
                    <b>${saveData.tag || ""}</b>

                    </div>
                    `;

                break;



                case "ALREADY_AUDITED":

                    document.getElementById("result").innerHTML = `
                    <div class="card red">

                    🛑 ALREADY AUDITED

                    <br><br>

                    🏷 Tag:
                    <b>${saveData.tag || ""}</b>

                    </div>
                    `;

                break;



                case "NOT_FOUND":

                    document.getElementById("result").innerHTML = `
                    <div class="card red">
                    ❌ NOT FOUND
                    </div>
                    `;

                break;



                default:

                    document.getElementById("result").innerHTML = `
                    <div class="card red">
                    ❌ ${saveData.status || "UNKNOWN ERROR"}

                    <br><br>

                    ${JSON.stringify(saveData)}

                    </div>
                    `;

            }


        }


    }
    catch(err){

        console.error(err);

        document.getElementById("result").innerHTML = `
        <div class="card red">
        ❌ ${err.message}
        </div>
        `;

    }
    finally{

        auditProcessing=false;

    }

}

let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function beep() {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "square";
  osc.frequency.value = 900;
  gain.gain.value = 0.15;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.12);
}

function vibrate() {
  if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
}

document.addEventListener("click", initAudio, { once: true });
