
<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
/* =========================================================
   ⚡ INVENTORY PRO — PREMIUM DARK GLASS UI
   CSS ONLY
   HTML / JAVASCRIPT UNCHANGED
   ========================================================= */

:root{
  --blue:#3b82f6;
  --blue-2:#2563eb;
  --blue-3:#60a5fa;
  --cyan:#22d3ee;
  --navy:#07111f;
  --navy-2:#0b1728;
  --panel:rgba(13,27,46,.82);
  --panel-2:rgba(18,35,58,.76);
  --glass:rgba(255,255,255,.055);
  --glass-strong:rgba(255,255,255,.09);

  --white:#f8fbff;
  --text:#e8f1ff;
  --muted:#8ea4c2;
  --muted-2:#657b98;

  --green:#22c55e;
  --green-2:#16a34a;

  --orange:#fb923c;
  --orange-2:#f97316;

  --red:#ef4444;

  --border:rgba(148,163,184,.14);
  --border-blue:rgba(59,130,246,.32);

  --shadow:
    0 25px 70px rgba(0,0,0,.35);

  --shadow-blue:
    0 18px 50px rgba(37,99,235,.22);

  --radius:18px;
}


/* =========================================================
   🌌 GLOBAL
   ========================================================= */

*{
  box-sizing:border-box;
}

html{
  min-height:100%;
  background:#050b14;
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  color:var(--text);

  background:
    radial-gradient(
      circle at 8% 0%,
      rgba(37,99,235,.22),
      transparent 28%
    ),
    radial-gradient(
      circle at 92% 12%,
      rgba(34,211,238,.10),
      transparent 25%
    ),
    radial-gradient(
      circle at 50% 100%,
      rgba(29,78,216,.13),
      transparent 34%
    ),
    linear-gradient(
      135deg,
      #050b14 0%,
      #081321 48%,
      #07111f 100%
    );

  overflow-x:hidden;
}


/* =========================================================
   ✨ SUBTLE BACKGROUND LIGHT
   ========================================================= */

body::before{
  content:"";

  position:fixed;
  inset:0;

  pointer-events:none;
  z-index:-1;

  background:
    linear-gradient(
      rgba(255,255,255,.018) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.018) 1px,
      transparent 1px
    );

  background-size:42px 42px;

  mask-image:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.7),
      transparent 85%
    );
}


/* =========================================================
   🔵 HEADER
   ========================================================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;

  display:flex;
  align-items:center;
  justify-content:space-between;

  min-height:70px;
  padding:12px 18px;

  background:
    linear-gradient(
      135deg,
      rgba(10,28,51,.94),
      rgba(7,20,36,.90)
    );

  border-bottom:
    1px solid rgba(96,165,250,.15);

  box-shadow:
    0 12px 35px rgba(0,0,0,.28);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}


.header::after{
  content:"";

  position:absolute;
  left:0;
  right:0;
  bottom:-1px;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(59,130,246,.65),
      rgba(34,211,238,.35),
      transparent
    );
}


.header-left{
  display:flex;
  align-items:center;
  gap:12px;
}


.header-left img{
  width:43px;
  height:43px;

  object-fit:contain;

  border-radius:13px;

  padding:5px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.12),
      rgba(255,255,255,.025)
    );

  border:
    1px solid rgba(255,255,255,.14);

  box-shadow:
    0 8px 24px rgba(0,0,0,.28);

  transition:
    transform .25s ease,
    box-shadow .25s ease;
}


.header-left img:hover{
  transform:
    translateY(-2px)
    rotate(-2deg);

  box-shadow:
    0 12px 28px rgba(37,99,235,.25);
}


.header-left h3{
  margin:0;

  color:#f4f8ff;

  font-size:16px;
  font-weight:750;

  letter-spacing:.45px;

  text-shadow:
    0 2px 12px rgba(0,0,0,.35);
}


/* =========================================================
   🔘 HEADER BUTTONS
   ========================================================= */

.header button{
  min-height:38px;

  padding:8px 13px;

  font-size:12px;
  font-weight:750;

  border-radius:11px;
}


.change-branch-btn{
  color:#dceaff !important;

  background:
    rgba(255,255,255,.055) !important;

  border:
    1px solid rgba(148,163,184,.22) !important;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  transition:
    transform .2s ease,
    background .2s ease,
    border-color .2s ease,
    box-shadow .2s ease !important;
}


.change-branch-btn:hover{
  background:
    rgba(59,130,246,.16) !important;

  border-color:
    rgba(96,165,250,.38) !important;

  transform:
    translateY(-2px) !important;

  box-shadow:
    0 8px 24px rgba(37,99,235,.18) !important;
}


.logout-btn{
  margin-left:6px;

  color:#0b1728;

  background:
    linear-gradient(
      135deg,
      #f8fbff,
      #dceaff
    );

  border:0;

  box-shadow:
    0 8px 20px rgba(0,0,0,.22);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}


.logout-btn:hover{
  transform:
    translateY(-2px);

  box-shadow:
    0 12px 26px rgba(0,0,0,.30);
}


/* =========================================================
   📦 MAIN CONTAINER
   ========================================================= */

.container{
  width:100%;
  max-width:920px;

  margin:0 auto;

  padding:24px 18px 45px;
}


/* =========================================================
   📷 SCANNERS
   ========================================================= */

#reader,
#auditReader{
  position:relative;

  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(37,99,235,.10),
      transparent 55%
    ),
    #020914;

  border:
    1px solid rgba(96,165,250,.25) !important;

  border-radius:24px !important;

  overflow:hidden;

  box-shadow:
    0 25px 60px rgba(0,0,0,.45),
    0 0 0 1px rgba(34,211,238,.035);

  isolation:isolate;
}


#reader::before,
#auditReader::before{
  content:"";

  position:absolute;
  inset:12px;

  border:
    1px solid rgba(96,165,250,.28);

  border-radius:17px;

  pointer-events:none;

  z-index:5;
}


#reader::after,
#auditReader::after{
  content:"";

  position:absolute;

  left:18%;
  right:18%;
  top:50%;

  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(34,211,238,.95),
      rgba(96,165,250,.95),
      transparent
    );

  box-shadow:
    0 0 12px rgba(34,211,238,.75),
    0 0 30px rgba(59,130,246,.35);

  pointer-events:none;

  z-index:10;

  animation:
    scanLine 2.4s ease-in-out infinite;
}


@keyframes scanLine{
  0%{
    transform:translateY(-110px);
    opacity:.15;
  }

  50%{
    opacity:1;
  }

  100%{
    transform:translateY(110px);
    opacity:.15;
  }
}


/* =========================================================
   🧾 INPUTS
   ========================================================= */

input{
  width:100%;

  min-height:48px;

  padding:12px 15px;

  margin:6px 0;

  color:#eaf3ff;

  background:
    rgba(7,19,34,.82);

  border:
    1px solid rgba(148,163,184,.16);

  border-radius:13px;

  outline:none;

  font-size:14px;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.025),
    0 8px 25px rgba(0,0,0,.16);

  transition:
    border-color .22s ease,
    box-shadow .22s ease,
    background .22s ease,
    transform .22s ease;
}


input::placeholder{
  color:#6f86a5;
}


input:hover{
  border-color:
    rgba(96,165,250,.28);
}


input:focus{
  background:
    rgba(8,23,42,.95);

  border-color:
    rgba(59,130,246,.75);

  box-shadow:
    0 0 0 3px rgba(59,130,246,.12),
    0 10px 28px rgba(37,99,235,.12);

  transform:
    translateY(-1px);
}


.si-input{
  margin-top:18px;

  background:
    linear-gradient(
      145deg,
      rgba(15,31,51,.94),
      rgba(8,20,35,.92)
    );

  border:
    1px solid rgba(96,165,250,.20);

  box-shadow:
    0 12px 30px rgba(0,0,0,.22);
}


/* =========================================================
   🔵 GLOBAL BUTTONS
   ========================================================= */

button{
  position:relative;

  min-height:46px;

  padding:11px 16px;

  border:0;
  border-radius:13px;

  color:#fff;

  font-family:inherit;
  font-size:13px;
  font-weight:750;

  cursor:pointer;

  overflow:hidden;

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    filter .18s ease,
    opacity .18s ease;
}


button::after{
  content:"";

  position:absolute;

  top:-30%;
  left:-120%;

  width:65%;
  height:160%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.22),
      transparent
    );

  transform:skewX(-20deg);

  transition:
    left .6s ease;

  pointer-events:none;
}


button:hover::after{
  left:145%;
}


button:hover{
  filter:brightness(1.07);
}


button:active{
  transform:
    translateY(1px)
    scale(.985);
}


button:disabled{
  cursor:not-allowed;

  filter:grayscale(.4);

  opacity:.45 !important;
}


button:focus-visible,
input:focus-visible{
  outline:
    2px solid rgba(34,211,238,.65);

  outline-offset:3px;
}


/* =========================================================
   💙 BLUE BUTTON
   ========================================================= */

.btn-blue{
  color:#fff;

  background:
    linear-gradient(
      135deg,
      #60a5fa 0%,
      #3b82f6 42%,
      #1d4ed8 100%
    );

  border:
    1px solid rgba(147,197,253,.18);

  box-shadow:
    0 10px 26px rgba(37,99,235,.25),
    inset 0 1px 0 rgba(255,255,255,.18);
}


.btn-blue:hover{
  transform:
    translateY(-2px);

  box-shadow:
    0 15px 34px rgba(37,99,235,.36),
    0 0 24px rgba(59,130,246,.12);
}


/* =========================================================
   🟠 ORANGE BUTTON
   ========================================================= */

.btn-orange{
  color:#fff;

  background:
    linear-gradient(
      135deg,
      #fdba74 0%,
      #fb923c 38%,
      #ea580c 100%
    );

  border:
    1px solid rgba(255,255,255,.13);

  box-shadow:
    0 10px 26px rgba(249,115,22,.20),
    inset 0 1px 0 rgba(255,255,255,.18);
}


.btn-orange:hover{
  transform:
    translateY(-2px);

  box-shadow:
    0 15px 34px rgba(249,115,22,.30);
}


/* =========================================================
   🟩 RESULT CARDS
   ========================================================= */

.card,
.no-results{
  position:relative;

  margin-top:16px;

  padding:20px;

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      rgba(15,31,51,.94),
      rgba(8,20,35,.90)
    );

  border:
    1px solid rgba(148,163,184,.12);

  box-shadow:
    0 16px 40px rgba(0,0,0,.24);

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  overflow:hidden;
}


.card::before{
  content:"";

  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:2px;

  background:
    linear-gradient(
      to bottom,
      transparent,
      rgba(96,165,250,.75),
      transparent
    );

  opacity:.8;
}


.card:hover{
  box-shadow:
    0 20px 48px rgba(0,0,0,.30);

  transform:
    translateY(-1px);
}


.green{
  border:
    1px solid rgba(34,197,94,.22);

  background:
    linear-gradient(
      145deg,
      rgba(10,42,31,.90),
      rgba(8,27,24,.92)
    );

  box-shadow:
    0 18px 45px rgba(34,197,94,.09);
}


.green::before{
  background:
    linear-gradient(
      to bottom,
      transparent,
      rgba(34,197,94,.95),
      transparent
    );
}


.red{
  border:
    1px solid rgba(239,68,68,.25);

  background:
    linear-gradient(
      145deg,
      rgba(53,18,25,.90),
      rgba(30,13,19,.92)
    );

  box-shadow:
    0 18px 45px rgba(239,68,68,.08);
}


.red::before{
  background:
    linear-gradient(
      to bottom,
      transparent,
      rgba(239,68,68,.95),
      transparent
    );
}


/* =========================================================
   💾 SAVING
   ========================================================= */

.saving{
  border:
    1px solid rgba(59,130,246,.30);

  background:
    linear-gradient(
      145deg,
      rgba(12,31,60,.95),
      rgba(8,20,38,.94)
    );

  box-shadow:
    0 18px 50px rgba(37,99,235,.16);
}


.saving::before{
  background:
    linear-gradient(
      to bottom,
      transparent,
      #3b82f6,
      #22d3ee,
      transparent
    );
}


.saving-text{
  margin-top:12px;

  color:#c9dcf7;

  font-size:14px;
  font-weight:650;
}


/* =========================================================
   ⏳ SPINNER
   ========================================================= */

.spinner{
  width:38px;
  height:38px;

  margin:auto;

  border:
    3px solid rgba(96,165,250,.15);

  border-top:
    3px solid #60a5fa;

  border-right:
    3px solid #22d3ee;

  border-radius:50%;

  box-shadow:
    0 0 24px rgba(59,130,246,.18);

  animation:
    spin .75s linear infinite;
}


@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================================================
   ❌ NO RESULTS
   ========================================================= */

.no-results{
  color:#9bb0ca;

  text-align:center;

  border:
    1px solid rgba(148,163,184,.13);

  background:
    linear-gradient(
      145deg,
      rgba(14,29,47,.90),
      rgba(8,19,33,.94)
    );
}


/* =========================================================
   🏢 BRANCH SCREEN
   ========================================================= */

#branchScreen{
  position:fixed;

  inset:0;

  z-index:9000;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:auto;

  padding:25px;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(59,130,246,.23),
      transparent 28%
    ),
    radial-gradient(
      circle at 85% 85%,
      rgba(34,211,238,.11),
      transparent 25%
    ),
    linear-gradient(
      135deg,
      #040b15,
      #071321 55%,
      #06101d
    );
}


#branchScreen::before{
  content:"";

  position:absolute;

  width:480px;
  height:480px;

  border-radius:50%;

  border:
    1px solid rgba(96,165,250,.07);

  box-shadow:
    0 0 100px rgba(37,99,235,.08);

  pointer-events:none;
}


/* =========================================================
   🏢 BRANCH CARD
   ========================================================= */

.branch-card{
  position:relative;

  width:390px;
  max-width:100%;

  padding:30px;

  border-radius:26px;

  background:
    linear-gradient(
      145deg,
      rgba(16,34,56,.88),
      rgba(7,19,34,.94)
    );

  border:
    1px solid rgba(148,163,184,.15);

  box-shadow:
    0 30px 90px rgba(0,0,0,.48),
    0 0 0 1px rgba(59,130,246,.04);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  animation:
    branchCardIn .45s cubic-bezier(.2,.8,.2,1);
}


.branch-card::before{
  content:"";

  position:absolute;

  left:24px;
  right:24px;
  top:0;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(96,165,250,.8),
      rgba(34,211,238,.45),
      transparent
    );
}


@keyframes branchCardIn{
  from{
    opacity:0;
    transform:
      translateY(22px)
      scale(.96);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }
}


.branch-card h2{
  margin:0 0 7px;

  font-size:24px;
  font-weight:800;

  letter-spacing:.3px;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #93c5fd 48%,
      #22d3ee
    );

  -webkit-background-clip:text;
  background-clip:text;

  -webkit-text-fill-color:transparent;
}


.branch-card p{
  margin:0 0 22px;

  color:#7f96b4;

  font-size:13px;
}


/* =========================================================
   🔲 BRANCH GRID
   ========================================================= */

.branch-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;
}


.branch-option{
  min-height:48px;

  color:#eef6ff;

  background:
    linear-gradient(
      145deg,
      rgba(59,130,246,.95),
      rgba(29,78,216,.92)
    );

  border:
    1px solid rgba(147,197,253,.16);

  border-radius:13px;

  box-shadow:
    0 8px 20px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.13);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}


.branch-option:hover{
  transform:
    translateY(-3px);

  background:
    linear-gradient(
      145deg,
      #60a5fa,
      #2563eb
    );

  box-shadow:
    0 14px 30px rgba(37,99,235,.30),
    0 0 20px rgba(59,130,246,.10);
}


.branch-option:active{
  transform:
    translateY(0)
    scale(.97);
}


/* =========================================================
   🔐 LOGIN SCREEN
   ========================================================= */

#loginScreen{
  position:fixed !important;

  inset:0 !important;

  z-index:9999;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(59,130,246,.20),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 85%,
      rgba(34,211,238,.10),
      transparent 28%
    ),
    linear-gradient(
      135deg,
      #040b15,
      #071321 52%,
      #06101d
    ) !important;
}


/* =========================================================
   🔐 LOGIN GLASS CARD
   ========================================================= */

#loginScreen::before{
  content:"";

  position:absolute;

  width:370px;
  height:510px;

  max-width:calc(100vw - 30px);

  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      rgba(16,34,56,.91),
      rgba(7,19,34,.96)
    );

  border:
    1px solid rgba(148,163,184,.15);

  box-shadow:
    0 35px 100px rgba(0,0,0,.50),
    0 0 0 1px rgba(59,130,246,.04);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  animation:
    loginCardIn .45s cubic-bezier(.2,.8,.2,1);

  pointer-events:none;
}


#loginScreen::after{
  content:"";

  position:absolute;

  width:280px;
  height:280px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(37,99,235,.18),
      transparent 70%
    );

  filter:blur(15px);

  pointer-events:none;
}


@keyframes loginCardIn{
  from{
    opacity:0;
    transform:
      translateY(22px)
      scale(.96);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }
}


#loginScreen h2{
  position:relative;
  z-index:2;

  margin:0 0 15px;

  font-size:25px;
  font-weight:850;

  letter-spacing:.7px;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #93c5fd 50%,
      #22d3ee
    );

  -webkit-background-clip:text;
  background-clip:text;

  -webkit-text-fill-color:transparent;
}


#loginScreen > *{
  position:relative;
  z-index:2;
}


#loginScreen .selected-branch-label{
  margin-bottom:5px;
}


/* =========================================================
   🏷 SELECTED BRANCH
   ========================================================= */

.selected-branch-label{
  padding:9px 14px;

  border-radius:999px;

  color:#a9d3ff;

  background:
    rgba(59,130,246,.10);

  border:
    1px solid rgba(96,165,250,.20);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04);

  font-size:12px;
  font-weight:750;

  letter-spacing:.35px;
}


/* =========================================================
   ⚠ LOGIN WARNING
   ========================================================= */

.login-warning{
  margin-top:12px;

  padding:14px;

  color:#fed7aa;

  background:
    linear-gradient(
      145deg,
      rgba(124,45,18,.34),
      rgba(67,25,12,.30)
    );

  border:
    1px solid rgba(251,146,60,.25);

  border-left:
    3px solid #fb923c;

  border-radius:13px;

  box-shadow:
    0 12px 30px rgba(249,115,22,.08);
}


/* =========================================================
   📊 AUDIT COUNTER
   ========================================================= */

#auditCounter{
  position:relative;

  width:max-content;

  min-width:140px;

  margin:14px auto;

  padding:9px 17px;

function sbHeaders(extra={}) {
  return Object.assign({
    apikey: SUPABASE_KEY,
    Authorization: "Bearer " + SUPABASE_KEY,
    Accept: "application/json",
    "Content-Type": "application/json"
  }, extra);
}

async function sbRequest(path, options={}) {
  const res = await fetch(SUPABASE_URL + path, Object.assign({}, options, {
    headers: sbHeaders(options.headers || {})
  }));
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : []; } catch(e) {
    throw new Error("Supabase returned invalid JSON: " + text.slice(0,300));
  }
  if (!res.ok) {
    const msg = data && (data.message || data.error || data.hint || data.details);
    throw new Error("Supabase HTTP " + res.status + (msg ? ": " + msg : ""));
  }
  return data;
}

function branchTable(branch, type) {
  const p = BRANCH_PREFIX[String(branch || "").trim().toUpperCase()];
  if (!p) throw new Error("INVALID BRANCH");
  return p + "_" + type;
}

function currentSession() {
  return JSON.parse(localStorage.getItem("inventorySession_" + BRANCH) || "{}");
}

async function requireSupabaseAccess() {
  const session = currentSession();
  const email = String(session.email || "").trim().toLowerCase();
  if (!BRANCH || !email || !session.sessionId) throw new Error("SESSION EXPIRED");

  const rows = await sbRequest("/rest/v1/allowed_users?email=eq." + encodeURIComponent(email) + "&select=*");
  if (!Array.isArray(rows) || !rows.length) throw new Error("EMAIL_DENIED");

  const active = rows.some(r => {
    const v = r.active ?? r.ACTIVE ?? r.enabled ?? r.ENABLED;
    return v === undefined || v === true || String(v).toLowerCase() === "true" || String(v) === "1";
  });
  if (!active) throw new Error("EMAIL_DENIED");

  const allowed = rows.some(r => {
    const raw = r.branch ?? r.BRANCH ?? r.branch_code ?? r.BRANCH_CODE ?? r.branches ?? r.BRANCHES;
    if (raw === undefined || raw === null || String(raw).trim() === "") return true;
    if (Array.isArray(raw)) return raw.map(x=>String(x).trim().toUpperCase()).includes(BRANCH);
    return String(raw).split(/[,|;]/).map(x=>x.trim().toUpperCase()).includes(BRANCH);
  });
  if (!allowed) throw new Error("EMAIL_DENIED");
  return {email, branch:BRANCH};
}

function normalizeBarcode(value) {
  return String(value || "").trim().replace(/\s+/g, "").toUpperCase();
}

/* EXACT ORIGINAL DECODE FIX — DO NOT CHANGE */
function decodeBarcode(code){
  code = String(code || "").trim().toUpperCase();
  if(code.indexOf("-") > -1){ return normalizeBarcode(code); }
  if(code.length % 2 !== 0){ return normalizeBarcode(code); }
  let result = "";
  try{
    for(let i = 0; i < code.length; i += 2){
      const value = parseInt(code.substr(i,2),16);
      if(isNaN(value)){ return normalizeBarcode(code); }
      result += String.fromCharCode(value ^ 91);
    }
    return normalizeBarcode(result);
  }catch(err){ return normalizeBarcode(code); }
}

function getBranchFromBarcode(barcode){
  const parts = normalizeBarcode(barcode).split("-");
  return parts.length >= 2 ? parts[0] : "";
}

function validateBarcodeBranch(barcode, branch){
  const parts = normalizeBarcode(barcode).split("-");
  return parts.length >= 2 && parts[0] === String(branch).trim().toUpperCase();
}

function formatLens(value) {
  if (value === null || value === undefined) return "";
  let str = String(value).trim();
  if (str.includes("#ERROR") || str.includes("#VALUE")) return "0.00";
  str = str.replace(/^\++/, "");
  const hadPlus = String(value).trim().startsWith("+");
  if (!isNaN(str) && str !== "" && !str.includes("/")) {
    const num = Number(str);
    return hadPlus ? "+" + num.toFixed(2) : num.toFixed(2);
  }
  if (str.includes("/")) return hadPlus ? "+" + str : str;
  return hadPlus ? "+" + str : str;
}

function stockRowArray(s){
  return [s.SDATE,s.SUPPLIER,s.DR,s.COST,s.ASG,s.CB,s.FD,s.UNITS,s.POWER,s.LENSTYPE,s.PUNIT,s.BR,s.NTAGN,s.CATEGORY,s.DESCRIPTION,s.LENSCODE,s.SELLINGPRICE,s.DELIVERYDATE,s.ORNUMBER,s.ORDATE,s.REMARKS,s.TAGPRICE,s.QR];
}

function manilaNow(){
  return new Intl.DateTimeFormat("en-US", {timeZone:"Asia/Manila", month:"2-digit",day:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true}).format(new Date());
}

async function getStockByBarcodeDirect(barcode){
  const parts = normalizeBarcode(barcode).split("-");
  if(parts.length < 2) return null;
  const br = parts[0], ntagn = parts.slice(1).join("-");
  const rows = await sbRequest("/rest/v1/" + branchTable(BRANCH,"stocks") + "?BR=eq." + encodeURIComponent(br) + "&NTAGN=eq." + encodeURIComponent(ntagn) + "&select=*&limit=1");
  return rows[0] || null;
}

async function isAlreadySoldDirect(barcode){
  const parts = normalizeBarcode(barcode).split("-");
  if(parts.length < 2) return null;
  const br = parts[0], ntagn = parts.slice(1).join("-");
  const rows = await sbRequest("/rest/v1/" + branchTable(BRANCH,"scanresults") + "?BR=eq." + encodeURIComponent(br) + "&NTAGN=eq." + encodeURIComponent(ntagn) + "&select=BR,NTAGN,DESCRIPTION,LENSTYPE&limit=1");
  return rows[0] || null;
}

async function directCheck(rawBarcode){
  await requireSupabaseAccess();
  const scannedBarcode = normalizeBarcode(rawBarcode);
  const barcode = decodeBarcode(scannedBarcode);
  if(!validateBarcodeBranch(barcode, BRANCH)){
    return {status:"WRONG BRANCH", selectedBranch:BRANCH, barcodeBranch:getBranchFromBarcode(barcode)};
  }
  const sold = await isAlreadySoldDirect(barcode);
  if(sold){ return {status:"DUPLICATE", colJ:String(sold.LENSTYPE||""), colO:String(sold.DESCRIPTION||""), tag:String(sold.NTAGN||"")}; }
  const stock = await getStockByBarcodeDirect(barcode);
  if(stock){ return {status:"FOUND", row:stockRowArray(stock), colJ:String(stock.LENSTYPE||""), colO:String(stock.DESCRIPTION||""), tag:String(stock.NTAGN||"")}; }
  return {status:"NOT FOUND"};
}

async function directSave(rawBarcode, siNo){
  const access = await requireSupabaseAccess();
  const barcode = decodeBarcode(normalizeBarcode(rawBarcode));
  if(!validateBarcodeBranch(barcode, BRANCH)) return {status:"WRONG BRANCH",selectedBranch:BRANCH,barcodeBranch:getBranchFromBarcode(barcode)};
  if(await isAlreadySoldDirect(barcode)) return {status:"ALREADY SAVED"};
  const stock = await getStockByBarcodeDirect(barcode);
  if(!stock) return {status:"NOT FOUND"};
  const row = stockRowArray(stock);
  while(row.length < 27) row.push("");
  row[14] = formatLens(row[14]);

async function directCheckTag(tag){

async function directSaveAudit(rawBarcode){
  const access=await requireSupabaseAccess();
  const barcode=decodeBarcode(normalizeBarcode(rawBarcode));
  if(!validateBarcodeBranch(barcode,BRANCH)) return {status:"WRONG BRANCH",selectedBranch:BRANCH,barcodeBranch:getBranchFromBarcode(barcode)};
  const parts=barcode.split("-");
  if(parts.length<2) return {status:"INVALID BARCODE"};
  const br=parts[0], ntagn=parts.slice(1).join("-");
  const auditTable=branchTable(BRANCH,"audit");
  const existing=await sbRequest("/rest/v1/"+auditTable+"?BR=eq."+encodeURIComponent(br)+"&NTAGN=eq."+encodeURIComponent(ntagn)+"&select=BR,NTAGN,%22DATE%20AND%20TIME%22&limit=1");
  if(existing.length) return {status:"ALREADY_AUDITED",tag:ntagn,date:existing[0]["DATE AND TIME"]};
  const stock=await getStockByBarcodeDirect(barcode);
  if(!stock) return {status:"NOT_FOUND"};
  const payload=[{SDATE:String(stock.SDATE||""),SUPPLIER:String(stock.SUPPLIER||""),DR:String(stock.DR||""),COST:String(stock.COST||""),ASG:String(stock.ASG||""),CB:String(stock.CB||""),FD:String(stock.FD||""),UNITS:String(stock.UNITS||""),POWER:String(stock.POWER||""),LENSTYPE:String(stock.LENSTYPE||""),PUNIT:String(stock.PUNIT||""),BR:String(stock.BR||""),NTAGN:String(stock.NTAGN||""),CATEGORY:String(stock.CATEGORY||""),DESCRIPTION:String(formatLens(stock.DESCRIPTION||"")),LENSCODE:String(stock.LENSCODE||""),SELLINGPRICE:String(stock.SELLINGPRICE||""),DELIVERYDATE:String(stock.DELIVERYDATE||""),ORNUMBER:String(stock.ORNUMBER||""),ORDATE:String(stock.ORDATE||""),REMARKS:String(stock.REMARKS||""),TAGPRICE:String(stock.TAGPRICE||""),QR:String(stock.QR||""),"SI NO.":"","DATE AND TIME":manilaNow(),"USER EMAIL":access.email,STATUS:"AUDITED"}];
  await sbRequest("/rest/v1/"+auditTable,{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(payload)});
  return {status:"RECORDED",colO:String(stock.DESCRIPTION||""),colJ:String(stock.LENSTYPE||""),tag:String(stock.NTAGN||"")};
}

async function processAuditQueue() {

    if (auditProcessing) return;

    auditProcessing = true;

    try {

        while (auditQueue.length > 0) {

            const barcode = auditQueue.shift();

            let saveData;
            try {
                saveData = await directSaveAudit(barcode);
            } catch(e) {
                document.getElementById("result").innerHTML = `<div class="card red">❌ ${e.message}</div>`;
                continue;
            }



            switch (saveData.status) {


                case "RECORDED":

                    auditCount++;

                    document.getElementById("auditCounter").innerHTML =
                    "Scanned : " + auditCount;


                    document.getElementById("result").innerHTML = `
                    <div class="card green scan-animate">

                    ✅ AUDIT RECORDED

                    <br><br>

                    <b>${saveData.colO || ""}</b><br>

                    ${saveData.colJ || ""}

                    <br>

                    🏷 Tag:
                    <b>${saveData.tag || ""}</b>

                    </div>
                    `;

                break;



                case "ALREADY_AUDITED":

                    document.getElementById("result").innerHTML = `
                    <div class="card red">

                    🛑 ALREADY AUDITED

                    <br><br>

                    🏷 Tag:
                    <b>${saveData.tag || ""}</b>

                    </div>
                    `;

                break;



                case "NOT_FOUND":

                    document.getElementById("result").innerHTML = `
                    <div class="card red">
                    ❌ NOT FOUND
                    </div>
                    `;

                break;



                default:

                    document.getElementById("result").innerHTML = `
                    <div class="card red">
                    ❌ ${saveData.status || "UNKNOWN ERROR"}

                    <br><br>

                    ${JSON.stringify(saveData)}

                    </div>
                    `;

            }


        }


    }
    catch(err){

        console.error(err);

        document.getElementById("result").innerHTML = `
        <div class="card red">
        ❌ ${err.message}
        </div>
        `;

    }
    finally{

        auditProcessing=false;

    }

}

async function searchSI() {

  clearUI();

  const siNo = document.getElementById("siNo").value.trim();
  const out = document.getElementById("searchResult");

  if (!siNo) {
    out.innerHTML = `
      <div class="no-results">
        ❌ ENTER SI NO.
      </div>
    `;
    return;
  }

  out.innerHTML = `
    <div class="card">
      🔎 SEARCHING SOLD OUT SI: <b>${siNo}</b>...
    </div>
  `;

  try {

    const data = await directSearchSI(siNo);

    console.log("SEARCH SI RESPONSE:", data);

    if (data.status === "ERROR") {
      out.innerHTML = `
        <div class="card red">
          ❌ SEARCH ERROR
          <br><br>
          ${data.error || "Unknown error"}
          ${data.details ? `<br><br><small>${data.details}</small>` : ""}
        </div>
      `;
      return;
    }

    if (!Array.isArray(data.items) || !data.items.length) {
      out.innerHTML = `
        <div class="no-results">
          ❌ No results found
          <br><br>
          SI No: <b>${siNo}</b>
          <br>
          Branch: <b>${BRANCH}</b>
        </div>
      `;
      return;
    }

    out.innerHTML = data.items.map((item, idx) => `
      <div class="card">
        #${idx + 1}<br>
        <b>${item.colO || ""}</b><br>
        ${item.colJ ? `<small>${item.colJ}</small><br>` : ""}
        <small>🏷 Tag: <b>${item.tag || ""}</b></small><br>
        <small>📄 SI No: <b>${item.siNo || siNo}</b></small><br>
        <small>📅 ${item.date || "No Date"}</small>
      </div>
    `).join("");

  } catch (err) {

    console.error("SEARCH SI ERROR:", err);

    out.innerHTML = `
      <div class="card red">
        ❌ SEARCH FAILED
        <br><br>
        ${err.message || err}
      </div>
    `;

  }
}

let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function beep() {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "square";
  osc.frequency.value = 900;
  gain.gain.value = 0.15;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.12);
}

function vibrate() {
  if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
}

document.addEventListener("click", initAudio, { once: true });

function askQuitAudit(pending){

    document.getElementById("quitAuditMessage").innerHTML = `
        ⚠ <b>${pending}</b> queued item(s) are still waiting to be processed.<br><br>

        If you stop now, those items <b>will NOT be saved.</b><br><br>

        Do you really want to stop Re-Inventory?
    `;

    document.getElementById("quitAuditDialog").style.display="flex";

    return new Promise(resolve=>{
        quitAuditResolve = resolve;
    });

}

function confirmQuitAudit(){

    document.getElementById("quitAuditDialog").style.display="none";

    if(quitAuditResolve){
        quitAuditResolve(true);
        quitAuditResolve=null;
    }

}

function cancelQuitAudit(){

    document.getElementById("quitAuditDialog").style.display="none";

    if(quitAuditResolve){
        quitAuditResolve(false);
        quitAuditResolve=null;
    }

}
